<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusBites | Sign In</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">
                <a href="index.html" class="logo">
                    🍴 Campus<span>Bites</span>
                </a>
                <p class="auth-subtitle">Welcome back! Please sign in to continue.</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="signin">Sign In</button>
                <button class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- Sign In Form -->
            <form id="signin-form" class="auth-form">
                <div class="form-group">
                    <label for="signin-email">Email</label>
                    <input
                        type="email"
                        id="signin-email"
                        placeholder="you@school.edu"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input
                        type="password"
                        id="signin-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>
                <p id="signin-error" class="auth-error hidden"></p>
                <button type="submit" class="btn btn-primary full-button">
                    Sign In
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input
                        type="text"
                        id="signup-name"
                        placeholder="Juan Dela Cruz"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input
                        type="email"
                        id="signup-email"
                        placeholder="you@school.edu"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input
                        type="password"
                        id="signup-password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input
                        type="password"
                        id="signup-confirm"
                        placeholder="Confirm your password"
                        required
                    >
                </div>
                <p id="signup-error" class="auth-error hidden"></p>
                <button type="submit" class="btn btn-primary full-button">
                    Create Account
                </button>
            </form>

        </div>

        <p class="auth-footer">
            © 2026 CampusBites • Campus food ordering made simple
        </p>

    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
