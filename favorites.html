<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusBites | Favorites</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        🍴 Campus<span>Bites</span>
    </a>

    <nav>

        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="orders.html">Orders</a>
        <a href="favorites.html" class="active">
            Favorites
        </a>
        <a href="profile.html">Profile</a>

    </nav>

    <a href="cart.html" class="cart-button">
        🛒 Cart
        <span id="cart-count">0</span>
    </a>

    <div class="auth-menu"></div>

</header>


<main class="page">

    <section class="page-header">

        <p class="eyebrow">SAVED FOOD</p>

        <h1>My Favorites ❤️</h1>

        <p>
            Your favorite meals are always one click away.
        </p>

    </section>


    <div id="favorite-foods" class="food-grid"></div>


    <div id="empty-favorites" class="empty-state hidden">

        <div class="empty-icon">❤️</div>

        <h2>No favorites yet</h2>

        <p>
            Click the heart on a food item to save it here.
        </p>

        <a href="menu.html" class="btn btn-primary">
            Browse Menu
        </a>

    </div>

</main>


<footer class="footer">

    <div>
        <a href="index.html" class="logo">
            🍴 Campus<span>Bites</span>
        </a>

        <p>
            Campus food ordering made simple.
        </p>
    </div>

    <p class="copyright">
        © 2026 CampusBites
    </p>

</footer>


<script src="js/data.js"></script>
<script src="js/app.js"></script>

<script src="js/favorites.js"></script>
